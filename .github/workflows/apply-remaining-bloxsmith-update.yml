name: Apply remaining BloxSmith update

on:
  push:
    branches: [main]
    paths:
      - .github/remaining-safe.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply remaining source updates
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/remaining-safe.patch
          perl -0pi -e 's/process\.env\.GROQ_API_KEY\s*\|\|\s*"gsk_[A-Za-z0-9]+"/process.env.GROQ_API_KEY/g' src/routes/api/assistant/execute.ts

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai-gateway.server.ts src/lib/ai-tools.server.ts src/routes/api/assistant/execute.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Apply remaining assistant gateway and image updates"
          git push
